<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --line: #262d36;
    --ink: #e6edf3;
    --dim: #8b949e;
    --accent: #4c8dff;
    --warn: #f0883e;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.5 "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #root { width: __WIDTH__px; padding: 40px; }

  .win {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: #11161d;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #30363d; }
  .bar .t { margin-left: 8px; color: var(--dim); font-size: 14px; }
  .body { padding: 22px 24px; }

  h1, h2, h3 { line-height: 1.25; }
  h1 { font-size: 30px; margin-bottom: 14px; }
  h2 { font-size: 22px; margin-bottom: 12px; }
  h3 { font-size: 17px; color: var(--dim); font-weight: 600;
       text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  p { margin-bottom: 10px; color: var(--dim); }

  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 14px;
       text-transform: uppercase; letter-spacing: .05em; }

  .row { display: flex; align-items: center; justify-content: space-between;
         padding: 13px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .muted { color: var(--dim); }
  .pill { display: inline-block; padding: 4px 11px; border-radius: 999px;
          font-size: 14px; background: #1f2937; color: var(--dim); }
  .pill.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .pill.warn { background: rgba(240,136,62,.15); color: var(--warn); }
  .pill.accent { background: rgba(76,141,255,.15); color: var(--accent); }
  .btn { display: inline-block; padding: 10px 18px; border-radius: 9px;
         background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .grid { display: grid; grid-template-columns: repeat(__COLS__, 1fr); gap: 14px; }
  .tile { background: #11161d; border: 1px solid var(--line);
          border-radius: 11px; padding: 18px; }
  code, .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 15px; }
</style>
<div id="root">__BODY__</div>
